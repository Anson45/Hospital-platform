# Local development infrastructure for the Hospital Platform.
# Polyglot persistence:
#   - SQL Server : Identity, Pharmacy/Billing
#   - PostgreSQL : Patient/Appointment, Analytics
#   - MongoDB    : AI service (chat history, usage logs, embeddings)
#   - Redis      : shared cache (dashboards, rate limits, token revocation)
#   - RabbitMQ   : event-driven messaging
#
# Usage (from repo root):
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml down        (add -v to also remove data)
#
# Give Docker at least 8 GB of RAM for this setup.
# Secrets here are for LOCAL development only. Never use these in cloud.

name: hospital-platform

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # One-shot container that creates the SQL Server databases, then exits.
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hp-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd!"
    volumes:
      - ./sql:/sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -i /sql/sqlserver-init.sql
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: hp-postgres
    environment:
      POSTGRES_USER: "hp_admin"
      POSTGRES_PASSWORD: "Your_strong_Passw0rd!"
      POSTGRES_DB: "postgres"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on first start (empty data dir): creates the Postgres HP* databases.
      - ./sql/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hp_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: hp-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: "hp_admin"
      MONGO_INITDB_ROOT_PASSWORD: "Your_strong_Passw0rd!"
      MONGO_INITDB_DATABASE: "HPAiDb"
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hp-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI: http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  sqlserver-data:
  postgres-data:
  mongo-data:
  redis-data:
  rabbitmq-data:
